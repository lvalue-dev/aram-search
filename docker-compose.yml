services:
  frostline:
    build: .
    image: frostline:latest
    container_name: frostline
    restart: unless-stopped
    ports:
      - "3000:3000"
    # 키와 설정은 .env.local 에서만 읽는다.
    # (여기 environment: 로 ${RIOT_API_KEY} 를 다시 적으면 셸에 값이 없을 때 빈 값으로 덮어써지므로 쓰지 않는다)
    env_file:
      - .env.local
