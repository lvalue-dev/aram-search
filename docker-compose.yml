services:
  frostline:
    build: .
    image: frostline:latest
    container_name: frostline
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - RIOT_API_KEY=${RIOT_API_KEY}
      # Riot 키 없이 데모 데이터로 띄우려면 주석 해제
      # - MOCK_RIOT_API=1
    env_file:
      - .env.local
